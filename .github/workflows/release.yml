name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# OpenTUI loads a per-platform native package (@opentui/core-<platform>-<arch>)
# that only installs on its own platform, so cross-compiling from one runner
# can't resolve the other targets. Each binary builds on its native runner.
jobs:
  build:
    strategy:
      fail-fast: false # one arch failing shouldn't cancel the others' builds
      matrix:
        include:
          # no darwin-x64: GitHub's Intel macOS runner pool (macos-13) is
          # effectively dead — Intel Mac users install via Bun instead
          - os: macos-14 # Apple Silicon
            suffix: darwin-arm64
          - os: ubuntu-latest
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone binary
        run: |
          mkdir -p dist
          bun build --compile --minify ./src/index.tsx --outfile "dist/hntui-${{ matrix.suffix }}"

      - name: Smoke test (Linux — binary boots and renders the UI)
        if: runner.os == 'Linux'
        # Gates OUR artifact (starts, native libs load, UI renders), not HN's
        # reachability from this runner — live data may not load here, so any
        # rendered chrome (stories, loading, or error screen) passes.
        run: |
          "./dist/hntui-${{ matrix.suffix }}" --version | grep -qE "^hntui [0-9]"
          echo "--- HN API reachability from this runner (informational):"
          curl -sS -m 10 https://hacker-news.firebaseio.com/v0/topstories.json | head -c 60 || true
          echo
          export TERM=xterm-256color
          (timeout 25 script -qefc "stty rows 40 cols 120; ./dist/hntui-${{ matrix.suffix }}" /dev/null > boot.log 2>&1 || true)
          # OpenTUI paints per-cell at narrow widths, so phrases only appear
          # contiguously after stripping the ANSI positioning sequences
          perl -pe 's/\e\[[0-9;?]*[a-zA-Z]//g; s/\e\][^\a\e]*(\a|\e\\)?//g; s/\e.//g' boot.log > boot.txt
          grep -aqE "comments|Loading stories|load stories" boot.txt || {
            echo "=== smoke test failed — stripped boot log tail ==="
            tail -c 2000 boot.txt | cat -v
            exit 1
          }

      - name: Smoke test (macOS — signature and boot)
        if: runner.os == 'macOS'
        # bun 1.3.13 shipped a --compile regression producing invalid
        # signatures that macOS SIGKILLs at exec — verify both explicitly
        run: |
          file "dist/hntui-${{ matrix.suffix }}" | grep -q "Mach-O"
          codesign --verify "dist/hntui-${{ matrix.suffix }}"
          "./dist/hntui-${{ matrix.suffix }}" --version | grep -qE "^hntui [0-9]"

      - name: Package tarball
        run: |
          cd dist
          cp "hntui-${{ matrix.suffix }}" hntui
          tar -czf "hntui-${{ matrix.suffix }}.tar.gz" hntui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hntui-${{ matrix.suffix }}
          path: dist/hntui-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    # ship whatever architectures built successfully rather than letting one
    # scarce runner pool (looking at you, macos-13) block the whole release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Require at least one binary
        run: ls dist/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          gh release create "$tag" dist/*.tar.gz --generate-notes ||
            gh release upload "$tag" dist/*.tar.gz --clobber
