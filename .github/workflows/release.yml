name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Asset names and tarball layout (a single `hntui` at the root) are what
# install.sh and every `hntui update` out there download, including the
# TypeScript releases' updater. Don't rename them.
jobs:
  build:
    strategy:
      fail-fast: false # one target failing shouldn't cancel the others
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          # Intel Macs: cross-compiled on the Apple Silicon runner
          - os: macos-14
            target: x86_64-apple-darwin
            suffix: darwin-x64
          # Linux builds link musl statically: one binary runs on any distro,
          # whatever its glibc (a glibc build from ubuntu-latest would refuse
          # to start on anything older than Ubuntu 24.04)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BIN: target/${{ matrix.target }}/release/hntui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test
        # the Intel Mac build is cross-compiled: its tests can't run here
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF#refs/tags/v}"
          have="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          [ "$want" = "$have" ] || { echo "tag v$want, Cargo.toml $have"; exit 1; }

      - name: Smoke test (Linux, static binary that boots and renders)
        if: runner.os == 'Linux'
        # Gates OUR artifact (starts, renders), not HN's reachability from
        # this runner: stories, the loader or the error screen all pass.
        run: |
          file "$BIN" | grep -qE "statically linked|static-pie linked"
          "$BIN" --version | grep -qE "^hntui [0-9]"
          export TERM=xterm-256color
          (timeout 15 script -qefc "stty rows 40 cols 120; $BIN" /dev/null > boot.log 2>&1 || true)
          perl -pe 's/\e\[[0-9;?]*[a-zA-Z]//g; s/\e\][^\a\e]*(\a|\e\\)?//g; s/\e.//g' boot.log > boot.txt
          grep -aqE "comments|Loading stories|load stories" boot.txt || {
            echo "=== smoke test failed: stripped boot log tail ==="
            tail -c 2000 boot.txt | cat -v
            exit 1
          }

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        # the linker signs arm64 builds on its own, but not the x86_64 one
        run: codesign --force --sign - "$BIN"

      - name: Smoke test (macOS, signed and boots)
        if: runner.os == 'macOS'
        run: |
          file "$BIN" | grep -q "Mach-O"
          codesign --verify "$BIN"
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            # runs under Rosetta where the runner has it
            arch -x86_64 "$BIN" --version || echo "(no Rosetta here; checked the binary only)"
          else
            "$BIN" --version | grep -qE "^hntui [0-9]"
          fi

      - name: Package tarball
        run: tar -czf "hntui-${{ matrix.suffix }}.tar.gz" -C "$(dirname "$BIN")" hntui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hntui-${{ matrix.suffix }}
          path: hntui-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    # Only for a tag, and only once every binary built: a release missing a
    # platform tells that platform's users to update to something that isn't
    # there. A manual run from a branch is a dry run (build + smoke tests).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Require every binary
        run: ls dist/hntui-darwin-arm64.tar.gz dist/hntui-darwin-x64.tar.gz dist/hntui-linux-x64.tar.gz dist/hntui-linux-arm64.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # notes: this version's CHANGELOG.md section, the text the app shows
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          awk -v h="## ${tag#v}" '$0 == h {f=1; next} /^## |^Older releases/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## ${tag#v}' section"; exit 1; }
          gh release create "$tag" dist/*.tar.gz --title "$tag" --notes-file notes.md ||
            gh release upload "$tag" dist/*.tar.gz --clobber
