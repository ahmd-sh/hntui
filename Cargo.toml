[package]
name = "hntui"
version = "0.6.0"
edition = "2021"
description = "Beautiful Hacker News browser for the terminal"
license = "MIT"

[dependencies]
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
regex = "1"
url = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
fastrand = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
